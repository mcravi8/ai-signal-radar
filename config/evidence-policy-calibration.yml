        dimensions: [technical_reality, market_pull]
      - evidence_id: alphasignal:trend:open-local-models-and-inference-efficiency
        event_id: alphasignal-efficient-inference-synthesis
        relationship: supporting-context
        dimensions: [market_pull]
      - evidence_id: interconnects:9347a64bc25f44ccdf21
        event_id: interconnects-open-model-recap
        relationship: supporting-context
