cases:
  - id: simulation-first-physical-ai
    title: Simulation-first physical AI development
    requirement: Physical-AI startups should use simulation and staged real-world validation before scaling autonomous deployment.
    description: >-
      Physical-AI systems should learn, rehearse, and fail inside instrumented simulated or
      robot-free environments before expensive or safety-critical deployment. Simulation does
      not replace real-world data: it creates a repeatable development and evaluation layer,
      while staged hardware tests measure where synthetic experience fails to transfer.
    what_it_looks_like:
      - Define simulation scenarios from real operating conditions, edge cases, and known failure modes.
      - Gate hardware deployment on repeatable simulated performance, then measure the sim-to-real gap during staged trials.
      - Feed real interventions and failures back into the environment, model, and release criteria instead of treating deployment as the end of training.
    applicable_to: Robotics, autonomous vehicles, industrial control, and other startups whose models take actions in the physical world; not a general requirement for software-only AI products.
    source_analysis: early-signal-tracker/simulation-first-physical-ai
    evidence_links:
