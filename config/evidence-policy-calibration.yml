cases:
  - id: evaluation-release-gates
    title: Evaluation and release gates
    requirement: Consequential AI workflows require evaluation and release gates.
    description: >-
      AI-generated work should not move directly from a model response into a consequential
      action. A separate release layer checks whether the result is correct enough, policy
      compliant, and safe to commit, send, publish, or execute. The gate can be automated for
      routine work and escalate uncertain or high-impact cases to a person.
    what_it_looks_like:
      - Maintain representative tasks, expected outcomes, and failure cases for every consequential workflow.
      - Run deterministic checks, model-based evaluations, and policy rules before external side effects.
      - Log the evidence behind release decisions and retain rollback or human-escalation paths.
    applicable_to: Startups deploying agents or generated outputs that can change code, data, money, customer communication, or production systems.
    source_analysis: early-signal-tracker/validation-as-release
    evidence_links:
