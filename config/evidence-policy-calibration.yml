        dimensions: [technical_reality]
      - evidence_id: alphasignal:project:wrenai
        event_id: wrenai-semantic-layer
        relationship: supporting-context
        dimensions: [operational_adoption, market_pull]
      - evidence_id: alphasignal:trend:documents-retrieval-and-structured-data
        event_id: alphasignal-structured-context-synthesis
        relationship: supporting-context
        dimensions: [market_pull]
      - evidence_id: arxiv:2609.21667v1
        event_id: archival-publication-knowledge-graph
        relationship: excluded
        dimensions: []
        exclusion_reason: The paper links scholarly publications to archived code; it does not demonstrate a shared operational context layer for AI workflows.
    assessments:
      technical_reality: strong
      operational_adoption: low
      market_pull: low
      evidence_independence: moderate
      concentration: moderate
      confidence: moderate
    gate_inputs:
      qualifying_events: 4
      technical_artifacts: 4
      independent_organizations: 4
      persistence_cycles: 2
      counterevidence_reviewed: false
      cost_of_absence_evidenced: false
      practical_minimum_available: true
    expected_maturity: experimental
    rationale: >-
      Stateful retrieval, evolving ontologies, real-time agent graphs, and persistent
      graph memory make the shared-context pattern technically credible. The corpus
      does not yet show two independent organizations using one context layer across
      multiple production workflows with measured outcomes.
    evidence_gaps:
      - Production case studies spanning multiple agents or workflows over the same governed context layer.
      - Measurements of maintenance cost, permission correctness, freshness, and task success versus workflow-specific RAG.
      - Counterevidence from simpler retrieval systems that achieve comparable outcomes without a shared ontology.

