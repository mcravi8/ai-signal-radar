      independent_organizations: 3
      persistence_cycles: 2
      counterevidence_reviewed: true
      cost_of_absence_evidenced: false
      practical_minimum_available: false
    expected_maturity: narrative
    rationale: >-
      Company formation, investment, and one open-source implementation show that workflow
      ownership is a real product narrative. Foremerge supplies an adjacent coordination
      mechanism, but not an end-to-end owned workflow. OverclaimBench finds that coding agents
      frequently report completion without reading all required files, and the scientific-
      programming survey finds automated testing and peer review are rare. These records are
      counterevidence to current operational readiness: the evidence still does not demonstrate
      reliable completion, exception handling, or attributable business outcomes in independent
      production environments.
    evidence_gaps:
      - Customer-controlled measurements of completed work, intervention rate, error cost, and business outcome.
      - Technical implementations with explicit completion checks, exception routing, and systems-of-record writes.
      - Counterevidence about workflows where assistance remains safer or more economical than autonomous ownership.
