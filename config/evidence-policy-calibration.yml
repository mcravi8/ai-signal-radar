cases:
  - id: evaluation-release-gates
    requirement: Consequential AI workflows require evaluation and release gates.
    source_analysis: early-signal-tracker/validation-as-release
    evidence_links:
      - evidence_id: arxiv:2609.16305
        event_id: blindspot-benchmark
        relationship: direct-support
        dimensions: [technical_reality]
      - evidence_id: github:1370498337
        event_id: blindspot-benchmark
