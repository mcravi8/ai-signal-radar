    title: "BLINDSPOT: A Benchmark for Safety and Refusal Calibration in Long-Horizon Tool-Using Agents"
    url: https://arxiv.org/abs/2609.16305
    published_at: "2026-09-14T20:12:27Z"
    summary: Introduces a trajectory-level benchmark for long-horizon tool-using agents, measuring safe completion, correct refusal, unsafe completion, over-refusal, indeterminate outcomes, and failures that emerge only after multiple stateful steps.
