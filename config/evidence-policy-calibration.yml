    assessments:
      technical_reality: strong
      operational_adoption: low
      market_pull: low
      evidence_independence: moderate
      concentration: moderate
      confidence: moderate
    gate_inputs:
      qualifying_events: 4
      technical_artifacts: 4
      independent_organizations: 4
      persistence_cycles: 2
      counterevidence_reviewed: false
      cost_of_absence_evidenced: false
      practical_minimum_available: true
    expected_maturity: experimental
    rationale: >-
      Stateful retrieval, evolving ontologies, real-time agent graphs, and persistent
      graph memory make the shared-context pattern technically credible. The corpus
      does not yet show two independent organizations using one context layer across
      multiple production workflows with measured outcomes.
    evidence_gaps:
      - Production case studies spanning multiple agents or workflows over the same governed context layer.
      - Measurements of maintenance cost, permission correctness, freshness, and task success versus workflow-specific RAG.
      - Counterevidence from simpler retrieval systems that achieve comparable outcomes without a shared ontology.

  - id: bounded-workflow-ownership
    title: Bounded workflow ownership
    requirement: AI products should own bounded workflows with explicit completion states, exception routing, and outcome metrics.
    description: >-
      The product is responsible for moving a clearly defined piece of work from trigger to
      verified completion, not merely suggesting the next step in a chat. Ownership remains
      bounded: the system knows its permitted actions, terminal state, escalation conditions,
      and the business outcome against which it will be judged.
    what_it_looks_like:
      - Define the trigger, allowed actions, system-of-record writes, and objective terminal state.
      - Make retries idempotent and route policy exceptions or low-confidence cases to a named owner.
      - Measure completed work, intervention rate, error cost, cycle time, and the downstream business outcome.
    applicable_to: Startups automating repeatable workflows with observable completion; ambiguous or high-liability work may remain assistive.
    source_analysis: operator-narratives/workflow-ownership
    evidence_links:
