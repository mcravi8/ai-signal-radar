sources:
  - id: arxiv
    name: arXiv
    channel: paper
    homepage_url: https://arxiv.org/
    logo_url: https://arxiv.org/static/browse/0.3.4/images/icons/favicon-32x32.png
    enabled: true
    collection: api
    categories: [cs.AI, cs.LG, cs.CL, cs.DC, cs.AR, cs.SE, cs.CR, stat.ML]
    source_quality: high
    commercial_bias: low

  - id: huggingface-papers
    name: Hugging Face Daily Papers
    channel: paper-curation
    homepage_url: https://huggingface.co/papers
    logo_url: https://huggingface.co/front/assets/huggingface_logo-noborder.svg
    enabled: true
    collection: official-cli
    limit: 50
    source_quality: medium
    commercial_bias: low

  - id: github
    name: GitHub
    channel: repository
    homepage_url: https://github.com/
    logo_url: https://github.githubassets.com/favicons/favicon.svg
    enabled: true
    collection: rest-api
    source_quality: medium
    commercial_bias: mixed

  - id: hacker-news
    name: Hacker News
    channel: community
    homepage_url: https://news.ycombinator.com/
    logo_url: https://news.ycombinator.com/y18.svg
