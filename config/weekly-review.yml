version: 1
maximum_assessment_queue: 10
minimum_priority_score: 45
material_change_thresholds:
  evidence_count_delta: 2
  source_count_delta: 1

priority_components:
  momentum: 25
  source_breadth: 25
  technical_support: 20
  new_evidence: 20
  operating_relevance: 10

candidate_adjudications:
  - candidate_id: theme:robotics-embodied-ai
    reviewed_at: "2026-09-25"
    outcome: conditional-requirement-added
    requirement_ids: [simulation-first-physical-ai]
    decision: Add a conditional requirement for physical-AI startups, not a universal startup requirement.
    rationale: >-
      Robotics activity is broad enough to deserve an operating conclusion, but the
      actionable requirement is narrower than the theme: physical-AI teams should use
      simulation, staged real-world validation, and explicit sim-to-real checks before
      scaling autonomous deployment.
    evidence_review:
      status: complete
      records_screened: 36
      links_added: 0
      finding: >-
        The broader vocabulary pass added first-party robotics systems, implementation
        reports, research, and repositories. It strengthens the physical-AI domain but does
        not change the operating conclusion: simulation and staged validation remain a
        conditional requirement only for systems acting in the physical world.
    reviewed_state:
      stage: broadly-corroborated
      movement: steady
      evidence_count: 36
      source_count: 12

  - candidate_id: theme:agent-harnesses
    reviewed_at: "2026-09-25"
    outcome: covered-by-existing-requirement
    requirement_ids: [modular-agent-operating-stack]
    decision: Do not create a duplicate requirement.
    rationale: >-
      An agent harness is the orchestration and control portion of the already-calibrated
      modular agent operating stack. Its evidence should strengthen that requirement rather
      than create a second entry with an indistinguishable operating prescription.
    evidence_review:
      status: complete
      records_screened: 67
      links_added: 4
      finding: >-
        Sixteen sources now support the orchestration layer, while the generic-agent cluster
        was deliberately left unresolved. The industrial comparison favoring a simpler
        single-agent baseline remains material counterevidence, so the modular-stack
        requirement stays emerging and conditional.
    reviewed_state:
      stage: corroborated-source-concentrated
      movement: falling
      evidence_count: 67
      source_count: 16

  - candidate_id: theme:coding-agents
    reviewed_at: "2026-09-25"
    outcome: domain-signal-not-separate-requirement
    requirement_ids: [evaluation-release-gates, bounded-workflow-ownership]
    decision: Treat coding agents as an application domain, not a standalone operating requirement.
    rationale: >-
      Coding agents make release gates and bounded workflow ownership more urgent, but
      "use coding agents" is not a defensible universal requirement. The reusable operating
      obligations are verified completion, constrained actions, review, rollback, and
      measurable workflow outcomes.
    evidence_review:
      status: complete
      records_screened: 101
      links_added: 5
      finding: >-
        Claude Code, AI-coding, and development-tool records materially expand capability and
        adoption evidence. They do not create a separate startup obligation: overclaiming,
        incomplete review, and CI bottlenecks instead reinforce independent release gates and
        bounded workflow ownership.
    reviewed_state:
      stage: broadly-corroborated
      movement: rising
      evidence_count: 101
      source_count: 15

  - candidate_id: theme:frontier-inference-infrastructure
    reviewed_at: "2026-09-25"
    outcome: infrastructure-signal-not-general-requirement
    requirement_ids: [heterogeneous-model-routing]
    decision: Do not require ordinary startups to build frontier inference infrastructure.
    rationale: >-
      The evidence supports inference optimization and model-path selection, but frontier
      clusters are a supplier capability and a conditional concern for infrastructure
      companies. Most startups should consume this capability through routing, capacity,
      latency, and cost controls rather than own the underlying cluster.
    evidence_review:
      status: complete
      records_screened: 46
      links_added: 6
      finding: >-
        CUDA, GPU-kernel, NIM, and inference-time-compute records deepen the supplier-side
        infrastructure signal. They still do not show that an application startup should own
        a frontier cluster; the reusable requirement remains routing, capacity, latency, cost,
        and fallback control across supplied inference paths.
    reviewed_state:
      stage: broadly-corroborated
      movement: steady
      evidence_count: 46
      source_count: 12

  - candidate_id: theme:skills-integrations
    reviewed_at: "2026-09-25"
    outcome: covered-by-existing-requirement
    requirement_ids: [modular-agent-operating-stack]
    decision: Do not create a separate requirement for skills, protocols, and integrations.
    rationale: >-
      Reusable skills and governed tool interfaces are one operating layer inside the modular
      agent stack. Splitting them into a second requirement would duplicate the existing
      obligations to version capabilities independently, constrain permissions, evaluate
      behavior, and preserve replaceable model and execution layers.
    evidence_review:
      status: complete
      records_screened: 80
      links_added: 5
      finding: >-
        Evaluated domain skills, repeatable deployment skills, MCP authorization, and
        graph-structured skill optimization materially strengthen technical reality. Direct
        API and single-agent critiques remain valid counterevidence: an interoperability layer
        is useful when governance or reuse warrants it, not as mandatory ceremony for every
        simple workflow.
    reviewed_state:
      stage: broadly-corroborated
      movement: steady
      evidence_count: 80
      source_count: 16

  - candidate_id: early:modular-agent-stack
    reviewed_at: "2026-09-25"
    outcome: source-analysis-already-calibrated
    requirement_ids: [modular-agent-operating-stack]
    decision: Keep one calibrated modular-stack requirement; do not duplicate the Early Signal direction.
    rationale: >-
      Early Signal lifecycle measures attention, breadth, and persistence, while Operating Model
      maturity requires technical and operational proof. The direction can be established as an
      industry signal while the corresponding startup requirement remains emerging because
      independent production adoption is still only moderate.
    evidence_review:
      status: complete
      records_screened: 8
      links_added: 0
      finding: >-
        The direction and requirement refer to the same architecture. A seventh source adds
        breadth but does not overcome the requirement's explicit blockers: strong operational
        adoption and strong evidence independence.
    reviewed_state:
      stage: established
      movement: accelerating
      evidence_count: 8
      source_count: 7

  - candidate_id: early:enterprise-data-boundary
    reviewed_at: "2026-09-24"
    outcome: conditional-requirement-added
    requirement_ids: [governed-proprietary-data-boundary]
    decision: Add an experimental requirement for startups handling proprietary, regulated, or customer-confidential data.
    rationale: >-
      The actionable conclusion is not that every company must self-host a model. It is that
      the company-controlled data layer should remain separate from replaceable models, with
      explicit controls for scoped access, training use, retention, deletion, human access,
      execution, audit, and provider exit.
    evidence_review:
      status: complete
      records_screened: 8
      links_added: 7
      finding: >-
        Benchling supplies one detailed tenant-isolation and exfiltration architecture;
        federated and trusted-computation systems make the pattern technically credible.
        Provider announcements show demand but do not verify contractual guarantees, while
        channel-level privacy leakage remains an unresolved counter-signal. The evidence clears
        experimental, not emerging, maturity.
    reviewed_state:
      stage: corroborating
      movement: accelerating
      evidence_count: 8
      source_count: 7

  - candidate_id: theme:voice-audio
    reviewed_at: "2026-09-24"
    outcome: modality-signal-not-general-requirement
    requirement_ids: [evaluation-release-gates, bounded-workflow-ownership]
    decision: Treat voice as a conditional interface and workflow domain, not a general startup operating requirement.
    rationale: >-
      Voice is technically credible and increasingly usable, but adoption depends on the user,
      environment, latency tolerance, accessibility needs, and workflow economics. Startups
      that choose voice inherit the existing obligations for verified completion, escalation,
      consent, fraud resistance, and measurable workflow outcomes; other startups should not
      add voice merely because the modality is advancing.
    evidence_review:
      status: complete
      records_screened: 23
      links_added: 0
      finding: >-
        Full-duplex models, self-hosted stacks, multilingual systems, and practitioner tooling
        show strong capability breadth. The corpus does not establish that voice is a default
        operating layer, and impersonation risk plus domain-specific recognition failures make
        it unsuitable as a universal requirement.
    reviewed_state:
      stage: broadly-corroborated
      movement: rising
      evidence_count: 23
      source_count: 12

  - candidate_id: theme:open-local-inference
    reviewed_at: "2026-09-25"
    outcome: covered-by-existing-requirements
    requirement_ids: [heterogeneous-model-routing, governed-proprietary-data-boundary]
    decision: Treat open and local inference as an execution option, not a universal standalone requirement.
    rationale: >-
      Open weights, quantization, and local runtimes expand the available inference portfolio.
      They become operationally relevant when a task needs lower cost, lower latency, data
      control, offline behavior, or provider independence. Those decisions are already captured
      by heterogeneous routing and the governed proprietary-data boundary; requiring local
      inference everywhere would ignore quality, maintenance, and hardware tradeoffs.
    evidence_review:
      status: complete
      records_screened: 98
      links_added: 3
      finding: >-
        Quantized runtime integration, adaptive inference research, and wider open-weight
        availability strengthen technical feasibility. The corpus still lacks independent
        production comparisons proving that local execution beats hosted inference after
        quality, operations, fallback, and hardware costs are included.
    reviewed_state:
      stage: corroborated-source-concentrated
      movement: rising
      evidence_count: 98
      source_count: 16

  - candidate_id: theme:multimodal-3d
    reviewed_at: "2026-09-25"
    outcome: capability-domain-not-general-requirement
    requirement_ids: []
    decision: Treat multimodal generation and 3D as a capability domain, not a general startup operating requirement.
    rationale: >-
      Images, video, spatial interfaces, and 3D generation can define the product for design,
      media, robotics, commerce, or simulation companies. They do not create one reusable
      operating obligation for startups outside those domains. Teams that adopt the modality
      still inherit the existing requirements for evaluation, bounded actions, provenance,
      and workflow-specific release criteria.
    evidence_review:
      status: complete
      records_screened: 51
      links_added: 0
      finding: >-
        Eleven source families and thirty technical records establish broad capability
        progress, but the evidence spans unrelated product domains and benchmarks. It does not
        establish a common operating practice, measurable cost of absence, or production
        control that every AI startup should implement.
    reviewed_state:
      stage: broadly-corroborated
      movement: steady
      evidence_count: 51
      source_count: 12

  - candidate_id: theme:training-self-improvement
    reviewed_at: "2026-09-25"
    outcome: covered-by-existing-requirement
    requirement_ids: [evaluation-release-gates]
    decision: Merge the operating conclusion into evaluation and release gates; do not require every startup to train or self-improve models.
    rationale: >-
      Training, feedback, evaluation, and self-improvement describe a wide capability family.
      The general startup obligation is narrower: measure representative workflow behavior and
      prevent unverified outputs or system changes from crossing a consequential boundary.
      Model training and recursive improvement remain optional strategies for teams whose
      economics and product require them.
    evidence_review:
      status: complete
      records_screened: 204
      links_added: 3
      finding: >-
        The vocabulary audit added pretraining, synthetic-data, federated-learning, scaling-law,
        and representation-learning records. This strengthens the capability family but makes
        it more heterogeneous, not more universal: the general operating obligation remains
        evaluation and release control rather than training a model.
    reviewed_state:
      stage: broadly-corroborated
      movement: steady
      evidence_count: 204
      source_count: 27

  - candidate_id: early:operational-context
    reviewed_at: "2026-09-25"
    outcome: linked-requirement-revalidated
    requirement_ids: [shared-operational-context]
    decision: Keep the shared operational context requirement at experimental maturity.
    rationale: >-
      The direction now connects newsletter analysis, research, and an open repository, which
      supports the architectural hypothesis. Three sources do not yet demonstrate repeatable
      production adoption, maintenance economics, or superiority over workflow-specific
      retrieval and direct integrations.
    evidence_review:
      status: complete
      records_screened: 5
      links_added: 0
      finding: >-
        Operational ontology, graph retrieval, and structured business context converge on one
        reusable layer. The evidence clears continued experimentation but not promotion to an
        established startup baseline.
    reviewed_state:
      stage: emerging
      movement: accelerating
      evidence_count: 5
      source_count: 3

  - candidate_id: early:simulation-first-physical-ai
    reviewed_at: "2026-09-25"
    outcome: linked-requirement-revalidated
    requirement_ids: [simulation-first-physical-ai]
    decision: Keep simulation-first development as an experimental, physical-AI-only requirement.
    rationale: >-
      Research, repositories, paper curation, and investor analysis now repeat the simulation
      pattern. The corpus still lacks comparative production evidence showing reliable
      sim-to-real transfer and lower total validation cost across independent deployments.
    evidence_review:
      status: complete
      records_screened: 6
      links_added: 0
      finding: >-
        Added source breadth confirms that simulation is an active development layer, while
        transfer quality remains the gating uncertainty. No universal software-startup
        requirement follows from this domain-specific evidence.
    reviewed_state:
      stage: emerging
      movement: steady
      evidence_count: 6
      source_count: 4

  - candidate_id: expert-finding:agent-operating-layer
    reviewed_at: "2026-09-25"
    outcome: source-analysis-covered-by-existing-requirements
    requirement_ids: [modular-agent-operating-stack, evaluation-release-gates]
    decision: Use the expert pattern as directional context for the modular stack and release gates.
    rationale: >-
      The synthesis describes context, tools, permissions, observability, and recovery—the same
      control surface already represented by the modular agent stack and evaluation gates.
      Social interpretation can direct attention but cannot independently verify operational
      adoption or effectiveness.
    evidence_review:
      status: complete
      records_screened: 5
      links_added: 0
      finding: >-
        Five experts independently emphasize the operating layer around agents. Technical and
        production evidence must still come from the linked requirements' underlying records,
        so no duplicate requirement or maturity promotion is warranted.
    reviewed_state:
      stage:
      movement: new
      evidence_count: 5
      source_count: 5

  - candidate_id: theme:proprietary-data-boundary
    reviewed_at: "2026-09-25"
    outcome: covered-by-existing-requirement
    requirement_ids: [governed-proprietary-data-boundary]
    decision: Use the new canonical theme to support the existing governed proprietary-data requirement.
    rationale: >-
      Federated execution, confidential computing, tenant isolation, sovereignty, and explicit
      training-use controls are technical expressions of the same controlled data boundary.
      Creating another requirement would duplicate the already calibrated obligation.
    evidence_review:
      status: complete
      records_screened: 10
      links_added: 0
      finding: >-
        Six independent sources establish a corroborated technical category, but repeatable
        production comparisons and verified provider guarantees remain thin. The corresponding
        startup requirement therefore remains experimental.
    reviewed_state:
      stage: corroborated
      movement: steady
      evidence_count: 10
      source_count: 6

  - candidate_id: expert-finding:evaluation-as-system-design
    reviewed_at: "2026-09-25"
    outcome: source-analysis-covered-by-existing-requirement
    requirement_ids: [evaluation-release-gates]
    decision: Use the expert pattern as directional context for evaluation and release gates, not as a separate requirement.
    rationale: >-
      The expert synthesis correctly describes a shift from one final benchmark toward
      continuous, task-specific evaluation. That is the engineering rationale already encoded
      by evaluation and release gates. Creating another requirement would duplicate the same
      practice while promoting social interpretation beyond its evidentiary role.
    evidence_review:
      status: complete
      records_screened: 5
      links_added: 0
      finding: >-
        Five experts provide independent narrative breadth, but social observations do not
        verify deployment or effectiveness. The finding is retained as directional context;
        technical support comes from the calibrated benchmark, authorization, abstention, and
        regression-testing records linked to the existing requirement.
    reviewed_state:
      stage:
      movement: new
      evidence_count: 5
      source_count: 5

verification_families:
  - id: company-formation
    title: AI company formation
    description: New AI companies in the official Y Combinator public directory provide a formation signal, not proof of adoption or durability.
    source_ids: [yc-companies]
    source_types: [company-directory]
    dimension: market_pull
    evidence_limit: 8
  - id: funding-activity
    title: Funding activity
    description: First-party investor announcements show capital formation. They remain commercially biased and cannot establish technical or operational reality.
    source_types: [investor-essay]
    terms: [funding, funded, investment, invested, seed, series, portfolio]
    dimension: market_pull
    evidence_limit: 8
  - id: customer-case-studies
    title: Customer case studies
    description: Named customer deployments can support operational adoption when the workflow, intervention boundary, and measured outcome are described.
    source_types: [first-party-lab, operator-essay, practitioner-blog]
    terms: [customer, case study, deployed, deployment, production, workflow, implementation]
    dimension: operational_adoption
    evidence_limit: 8
  - id: job-postings
    title: AI job postings
    description: Public YC startup jobs reveal intended operational ownership. Hiring intent is supporting context, not evidence that a system is deployed.
    source_ids: [yc-jobs]
    source_types: [job-posting]
    dimension: operational_adoption
    evidence_limit: 8
  - id: github-adoption
    title: GitHub adoption proxies
    description: Stars, forks, and recent pushes help prioritize engineering artifacts. Popularity is never treated as production adoption.
    source_ids: [github]
    source_types: [repository]
    dimension: technical_reality
    evidence_limit: 8
  - id: production-architecture
    title: Production architecture reports
    description: Detailed architecture and deployment reports are the strongest public bridge between technical possibility and real operating use.
    source_types: [first-party-lab, practitioner-blog, operator-essay]
    terms: [architecture, production, deployed, deployment, platform, reliability, latency, scale]
    dimension: operational_adoption
    evidence_limit: 8
