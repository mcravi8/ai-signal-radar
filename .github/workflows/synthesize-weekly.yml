name: Synthesize weekly radar

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/synthesize-weekly.yml
      - config/bluesky.yml
      - config/classification-audit.yml
      - config/discovery.yml
      - config/discovery-concepts.yml
      - config/discovery-clustering.yml
      - config/evidence-policy-calibration.yml
      - config/evidence-policy.yml
      - config/keywords.yml
      - config/newsletters.yml
      - config/project-reviews.yml
      - config/source-theme-mappings.yml
      - config/sources.yml
      - config/taxonomy.yml
      - config/weekly-review.yml
      - data/manual/**
      - pipeline/collectors/agentmail.py
      - pipeline/collectors/bluesky.py
      - pipeline/collectors/yc.py
      - pipeline/cli.py
      - pipeline/evidence_policy.py
      - pipeline/discovery.py
      - pipeline/concepts.py
      - pipeline/discovery_cluster.py
      - pipeline/export_public.py
      - pipeline/research.py
      - pipeline/storage.py
      - pipeline/weekly_review.py
  schedule:
    - cron: "23 7 * * 0"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: synthesize-weekly
  cancel-in-progress: false

jobs:
  synthesize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AGENTMAIL_API_KEY: ${{ secrets.AGENTMAIL_API_KEY }}
      AGENTMAIL_INBOX_ID: ai-signal-radar@agentmail.to
      AI_RADAR_REQUIRE_AGENTMAIL: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -e .
      - run: python -m pipeline.cli collect-verification
      - run: python -m pipeline.cli collect-bluesky
      - run: python -m pipeline.cli collect-newsletters
      - run: python -m pipeline.cli synthesize
      - run: python -m pipeline.cli validate-public
      - run: python -m pipeline.cli calibrate-evidence
      - run: python scripts/build_site.py
      - run: python -m unittest discover -s tests -v
      - name: Commit synthesized public data
        run: |
          git config user.name "ai-signal-radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/processed data/public data/snapshots data/state reports/weekly
          git diff --cached --quiet || git commit -m "report: update weekly radar"
          git push
