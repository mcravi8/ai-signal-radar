        dimensions: [technical_reality]
      - evidence_id: arxiv:2609.20625v1
        event_id: chronicle-regression-testing
        relationship: direct-support
        dimensions: [technical_reality]
      - evidence_id: arxiv:2609.21841v1
        event_id: enterpriseval-evaluation-system
        relationship: direct-support
        dimensions: [technical_reality]
      - evidence_id: arxiv:2609.22068v1
        event_id: codemidas-verifiers
        relationship: supporting-context
        dimensions: [technical_reality]
      - evidence_id: alphasignal:trend:validation-and-release-bottlenecks
        event_id: alphasignal-validation-synthesis
        relationship: supporting-context
        dimensions: [market_pull]
      - evidence_id: hf-paper:2609.14858
        event_id: dream-rsi-paper
        relationship: discovery-only
        dimensions: []
      - evidence_id: the-batch:2622ee409c0a925f8cee
        event_id: batch-coding-agents-roundup
        relationship: discovery-only
        dimensions: []
    assessments:
      technical_reality: strong
      operational_adoption: low
      market_pull: low
      evidence_independence: low
      concentration: high
      confidence: moderate
    gate_inputs:
      qualifying_events: 3
      technical_artifacts: 3
      independent_organizations: 3
      persistence_cycles: 1
      counterevidence_reviewed: false
      cost_of_absence_evidenced: false
      practical_minimum_available: true
    expected_maturity: experimental
    rationale: >-
      Several independent technical systems make the requirement technically real,
      but the sampled corpus does not contain independent production deployments with
      measured operating outcomes. Research and engineering evidence dominate.
    evidence_gaps:
      - Independent production reports with intervention, rollback, or incident metrics.
      - A systematic search for cases where conventional testing and access controls were sufficient.

