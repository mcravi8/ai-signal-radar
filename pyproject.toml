[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-signal-radar"
version = "0.1.0"
description = "A public, evidence-linked radar for emerging AI categories, papers, projects, and narratives."
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0,<7",
  "huggingface-hub>=0.30,<3",
  "jsonschema>=4.23,<5",
]

[project.scripts]
ai-signal-radar = "pipeline.cli:main"

[tool.setuptools.packages.find]
include = ["pipeline*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
