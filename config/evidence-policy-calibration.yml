    rationale: >-
      Independent technical systems make the requirement technically real. Payment
      authorization, calibrated abstention, regression testing, and replay-gated procedural
      memory show that evaluation can govern actions and system changes rather than remain a
      final benchmark. OverclaimBench shows why a model's own completion statement is not an
      adequate release decision. A survey of 527 scientific programmers is retained as
      counterevidence to adoption: generated code is often run, but automated tests and
      independent review are rare. The sampled corpus still lacks production deployments with
      measured operating outcomes, and research evidence remains concentrated in papers.
    evidence_gaps:
      - Independent production reports with intervention, rollback, or incident metrics.
