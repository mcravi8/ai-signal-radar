  - id: governed-proprietary-data-boundary
    title: Governed proprietary data boundary
    requirement: Startups handling proprietary or regulated data should keep the source-of-truth data behind a governed boundary and expose only permitted context or computation to replaceable models.
    description: >-
      The company-controlled data layer remains separate from the model provider. Agents and
      models receive scoped context through permission-aware retrieval, tools, or protected
      computation rather than unrestricted copies of the underlying corpus. Training use,
      retention, deletion, human access, execution location, and downstream writes are treated
      as distinct controls that can be audited and changed without moving the source of truth.
    what_it_looks_like:
      - Keep sensitive records in company-controlled systems and issue least-privilege, task-scoped access to models and agents.
      - Record provider-specific rules for training use, retention, deletion, human access, subprocessors, regional execution, and fine-tuning.
      - Add exfiltration controls, audit trails, revocation, and a model-provider exit path around every workflow that touches proprietary data.
    applicable_to: Startups handling customer-confidential, regulated, security-sensitive, or uniquely valuable workflow data; public-data prototypes may not need the full boundary.
    source_analysis: early-signal-tracker/enterprise-data-boundary
    evidence_links:
      - evidence_id: aws-machine-learning-blog:2335ca1a4875d9c28b23
        event_id: benchling-agentcore-data-isolation
        relationship: direct-support
        dimensions: [technical_reality, operational_adoption]
      - evidence_id: arxiv:2609.21728v1
        event_id: tee-digital-computation-rights
        relationship: direct-support
        dimensions: [technical_reality]
      - evidence_id: nvidia-developer-blog:c6cbeb9f9f96e88e05d7
        event_id: nvidia-flare-federated-execution
        relationship: direct-support
        dimensions: [technical_reality]
      - evidence_id: openai-news:192794312f979cbd50ee
        event_id: astra-law-confidential-data-controls
        relationship: supporting-context
        dimensions: [operational_adoption, market_pull]
      - evidence_id: mistral-news:830fb9aa9b114f2dafe7
        event_id: cloudera-mistral-sovereign-enterprise-ai
        relationship: supporting-context
        dimensions: [operational_adoption, market_pull]
      - evidence_id: anthropic-news-research:f4efc55098543f59e5e3
        event_id: anthropic-privacy-preserving-research-access
        relationship: supporting-context
        dimensions: [technical_reality, operational_adoption]
      - evidence_id: arxiv:2609.21686v1
        event_id: cipl-recoverable-agent-privacy-leakage
        relationship: counterevidence
        dimensions: [technical_reality, operational_adoption]
    assessments:
      technical_reality: moderate
      operational_adoption: low
      market_pull: moderate
      evidence_independence: moderate
      concentration: moderate
      confidence: moderate
    gate_inputs:
      qualifying_events: 3
      technical_artifacts: 3
      independent_organizations: 6
      persistence_cycles: 2
      counterevidence_reviewed: true
      cost_of_absence_evidenced: false
      practical_minimum_available: true
    expected_maturity: experimental
    rationale: >-
      A detailed Benchling deployment demonstrates tenant isolation and exfiltration controls,
      while federated execution and trusted-computation research make the architecture
      technically credible. Provider and partnership announcements show market pull but do not
      independently verify contractual training exclusion, retention, deletion, or human-access
      guarantees. CIPL is retained as counterevidence because scoped internal components can
      still leak recoverable information through observable channels. The requirement is
      therefore experimental rather than emerging: the control pattern is actionable, but
      repeatable independent operating adoption has not been demonstrated.
    evidence_gaps:
      - Customer-controlled audits of training exclusion, retention, deletion, human access, subprocessors, and regional execution.
      - Independent deployments reporting exfiltration incidents, permission failures, portability, latency, and operating cost.
      - Comparative evidence showing when governed hosted access is sufficient and when local, sovereign, or confidential execution is necessary.

  - id: ai-native-gtm
    title: AI-native GTM systems
    requirement: Startups should operate closed-loop AI-native GTM systems that sense, decide, and act across revenue workflows.
    description: >-
      An AI-native go-to-market system would do more than generate sales or marketing content.
      It would continuously observe demand signals, decide what action is appropriate, execute
      approved steps across revenue tools, and write the outcome back to the system of record.
      The loop should make attribution and human accountability clearer, not obscure them.
    what_it_looks_like:
      - Start with one bounded motion such as inbound qualification, account research, or content refresh.
      - Use explicit triggers, approval boundaries, CRM writes, and attribution rather than an open-ended sales agent.
      - Measure pipeline contribution, cycle time, intervention rate, and false-action cost.
    applicable_to: Startups with repeatable revenue workflows and reliable systems-of-record; not a substitute for product-market fit or GTM judgment.
    source_analysis: operator-narratives/ai-native-gtm-watch
    evidence_links:
      - evidence_id: greylock-essays:32b264a22d3e04806ae3
        event_id: airops-investment-and-launch
        relationship: direct-support
        dimensions: [market_pull]
      - evidence_id: greylock-essays:841d14442685e9cea677
        event_id: netic-investment-and-launch
        relationship: direct-support
        dimensions: [market_pull]
      - evidence_id: alphasignal:trend:enterprise-and-vertical-ai
        event_id: alphasignal-enterprise-ai-synthesis
        relationship: supporting-context
        dimensions: [market_pull]
    assessments:
      technical_reality: not-observed
      operational_adoption: low
      market_pull: low
      evidence_independence: low
      concentration: high
      confidence: low
    gate_inputs:
      qualifying_events: 2
      technical_artifacts: 0
      independent_organizations: 2
      persistence_cycles: 2
      counterevidence_reviewed: false
      cost_of_absence_evidenced: false
      practical_minimum_available: false
    expected_maturity: narrative
    rationale: >-
      Two companies and investment events show category formation, but both primary
      observations come from one investor-publisher. There is no qualifying technical
      evidence or independent operating-outcome evidence in the current corpus.
    evidence_gaps:
      - Customer or operator reports with attributable pipeline, revenue, or cycle-time outcomes.
      - Independent technical descriptions of the closed-loop system and its controls.
      - Evidence from publishers unrelated to the investor announcements.

  - id: modular-agent-operating-stack
    title: Modular agent operating stack
    requirement: AI systems should separate models, orchestration, reusable skills, execution environments, and assurance controls into replaceable operating layers.
    description: >-
      The model becomes one replaceable component inside a larger operating system for agents.
      The harness controls the loop, skills package repeatable actions, sandboxes constrain
      execution, interfaces expose progress to people, and assurance controls decide what may
      proceed. Separating these responsibilities makes behavior easier to test and change.
    what_it_looks_like:
      - Keep model adapters separate from orchestration state and workflow control logic.
      - Version reusable skills and tool permissions independently from prompts and model releases.
      - Run actions in bounded environments with traces, evaluations, approval gates, and rollback.
    applicable_to: Startups operating multiple agent workflows or consequential agents; simple trusted scripts may not benefit from every layer.
    source_analysis: early-signal-tracker/modular-agent-stack
