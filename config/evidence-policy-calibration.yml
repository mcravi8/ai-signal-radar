    assessments:
      technical_reality: strong
      operational_adoption: moderate
      market_pull: moderate
      evidence_independence: moderate
      concentration: moderate
      confidence: moderate
    gate_inputs:
      qualifying_events: 5
      technical_artifacts: 5
      independent_organizations: 4
      persistence_cycles: 3
      counterevidence_reviewed: true
      cost_of_absence_evidenced: false
      practical_minimum_available: true
    expected_maturity: emerging
    rationale: >-
      Independent technical artifacts show that harness, skill, execution, and
      assurance components can be separated, while Wood Mackenzie and Benchling
      provide two detailed production deployments. Operational evidence is still
      concentrated in AWS-published case studies, so adoption and independence do
      not yet qualify as strong.
    evidence_gaps:
      - Production accounts published outside a single infrastructure vendor's channel.
      - Comparative evidence on when modular interfaces reduce switching cost enough to offset orchestration complexity.
      - Longer persistence showing that interfaces remain portable as models and runtimes change.

  - id: shared-operational-context
    requirement: AI systems operating across organizational data should use a shared semantic and operational context layer instead of rebuilding retrieval and schemas for every workflow.
    source_analysis: early-signal-tracker/operational-context
    evidence_links:
