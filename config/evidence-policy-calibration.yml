      Adaptive routing and heterogeneous inference are demonstrated technically, but
      the selected evidence does not establish repeatable production adoption or
      superior operating economics across independent companies.
    evidence_gaps:
      - Production comparisons of quality, latency, failure rate, and cost per accepted outcome.
      - Evidence that routing complexity remains worthwhile after maintenance and fallback costs.

  - id: ai-native-gtm
    title: AI-native GTM systems
    requirement: Startups should operate closed-loop AI-native GTM systems that sense, decide, and act across revenue workflows.
    description: >-
      An AI-native go-to-market system would do more than generate sales or marketing content.
      It would continuously observe demand signals, decide what action is appropriate, execute
      approved steps across revenue tools, and write the outcome back to the system of record.
      The loop should make attribution and human accountability clearer, not obscure them.
    what_it_looks_like:
      - Start with one bounded motion such as inbound qualification, account research, or content refresh.
      - Use explicit triggers, approval boundaries, CRM writes, and attribution rather than an open-ended sales agent.
      - Measure pipeline contribution, cycle time, intervention rate, and false-action cost.
    applicable_to: Startups with repeatable revenue workflows and reliable systems-of-record; not a substitute for product-market fit or GTM judgment.
    source_analysis: operator-narratives/ai-native-gtm-watch
    evidence_links:
      - evidence_id: greylock-essays:32b264a22d3e04806ae3
        event_id: airops-investment-and-launch
        relationship: direct-support
        dimensions: [market_pull]
      - evidence_id: greylock-essays:841d14442685e9cea677
        event_id: netic-investment-and-launch
        relationship: direct-support
        dimensions: [market_pull]
      - evidence_id: alphasignal:trend:enterprise-and-vertical-ai
        event_id: alphasignal-enterprise-ai-synthesis
        relationship: supporting-context
        dimensions: [market_pull]
    assessments:
      technical_reality: not-observed
      operational_adoption: low
      market_pull: low
      evidence_independence: low
      concentration: high
      confidence: low
    gate_inputs:
      qualifying_events: 2
      technical_artifacts: 0
      independent_organizations: 2
      persistence_cycles: 2
      counterevidence_reviewed: false
      cost_of_absence_evidenced: false
      practical_minimum_available: false
    expected_maturity: narrative
    rationale: >-
      Two companies and investment events show category formation, but both primary
      observations come from one investor-publisher. There is no qualifying technical
      evidence or independent operating-outcome evidence in the current corpus.
    evidence_gaps:
      - Customer or operator reports with attributable pipeline, revenue, or cycle-time outcomes.
      - Independent technical descriptions of the closed-loop system and its controls.
      - Evidence from publishers unrelated to the investor announcements.

  - id: modular-agent-operating-stack
    title: Modular agent operating stack
    requirement: AI systems should separate models, orchestration, reusable skills, execution environments, and assurance controls into replaceable operating layers.
    description: >-
      The model becomes one replaceable component inside a larger operating system for agents.
      The harness controls the loop, skills package repeatable actions, sandboxes constrain
      execution, interfaces expose progress to people, and assurance controls decide what may
      proceed. Separating these responsibilities makes behavior easier to test and change.
    what_it_looks_like:
      - Keep model adapters separate from orchestration state and workflow control logic.
      - Version reusable skills and tool permissions independently from prompts and model releases.
      - Run actions in bounded environments with traces, evaluations, approval gates, and rollback.
    applicable_to: Startups operating multiple agent workflows or consequential agents; simple trusted scripts may not benefit from every layer.
    source_analysis: early-signal-tracker/modular-agent-stack
    evidence_links:
      - evidence_id: aws-machine-learning-blog:5d4f323bd0d514800a8a
        event_id: wood-mackenzie-apex-platform
