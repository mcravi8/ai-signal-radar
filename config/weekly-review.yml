version: 1
maximum_assessment_queue: 10
minimum_priority_score: 45
material_change_thresholds:
  priority_score_delta: 5
  evidence_count_delta: 2
  source_count_delta: 1

priority_components:
  momentum: 25
  source_breadth: 25
  technical_support: 20
  new_evidence: 20
  operating_relevance: 10

candidate_adjudications:
  - candidate_id: theme:robotics-embodied-ai
    reviewed_at: "2026-09-22"
    outcome: conditional-requirement-added
    requirement_ids: [simulation-first-physical-ai]
    decision: Add a conditional requirement for physical-AI startups, not a universal startup requirement.
    rationale: >-
      Robotics activity is broad enough to deserve an operating conclusion, but the
      actionable requirement is narrower than the theme: physical-AI teams should use
      simulation, staged real-world validation, and explicit sim-to-real checks before
      scaling autonomous deployment.
    reviewed_state:
      stage: corroborated
      movement: new
      evidence_count: 16
      source_count: 8

  - candidate_id: theme:agent-harnesses
    reviewed_at: "2026-09-22"
    outcome: covered-by-existing-requirement
    requirement_ids: [modular-agent-operating-stack]
    decision: Do not create a duplicate requirement.
    rationale: >-
      An agent harness is the orchestration and control portion of the already-calibrated
      modular agent operating stack. Its evidence should strengthen that requirement rather
      than create a second entry with an indistinguishable operating prescription.
    reviewed_state:
      stage: corroborated-source-concentrated
      movement: rising
      evidence_count: 56
      source_count: 13

  - candidate_id: theme:coding-agents
    reviewed_at: "2026-09-22"
    outcome: domain-signal-not-separate-requirement
    requirement_ids: [evaluation-release-gates, bounded-workflow-ownership]
    decision: Treat coding agents as an application domain, not a standalone operating requirement.
    rationale: >-
      Coding agents make release gates and bounded workflow ownership more urgent, but
      "use coding agents" is not a defensible universal requirement. The reusable operating
      obligations are verified completion, constrained actions, review, rollback, and
      measurable workflow outcomes.
    reviewed_state:
      stage: corroborated-source-concentrated
      movement: rising
      evidence_count: 62
      source_count: 14

  - candidate_id: theme:frontier-inference-infrastructure
    reviewed_at: "2026-09-22"
    outcome: infrastructure-signal-not-general-requirement
    requirement_ids: [heterogeneous-model-routing]
    decision: Do not require ordinary startups to build frontier inference infrastructure.
    rationale: >-
      The evidence supports inference optimization and model-path selection, but frontier
      clusters are a supplier capability and a conditional concern for infrastructure
      companies. Most startups should consume this capability through routing, capacity,
      latency, and cost controls rather than own the underlying cluster.
    reviewed_state:
      stage: broadly-corroborated
      movement: rising
      evidence_count: 29
      source_count: 8

verification_families:
  - id: company-formation
    title: AI company formation
    description: New AI companies in the official Y Combinator public directory provide a formation signal, not proof of adoption or durability.
    source_ids: [yc-companies]
    source_types: [company-directory]
    dimension: market_pull
    evidence_limit: 8
  - id: funding-activity
    title: Funding activity
    description: First-party investor announcements show capital formation. They remain commercially biased and cannot establish technical or operational reality.
    source_types: [investor-essay]
    terms: [funding, funded, investment, invested, seed, series, portfolio]
    dimension: market_pull
    evidence_limit: 8
  - id: customer-case-studies
    title: Customer case studies
    description: Named customer deployments can support operational adoption when the workflow, intervention boundary, and measured outcome are described.
    source_types: [first-party-lab, operator-essay, practitioner-blog]
    terms: [customer, case study, deployed, deployment, production, workflow, implementation]
    dimension: operational_adoption
    evidence_limit: 8
  - id: job-postings
    title: AI job postings
    description: Public YC startup jobs reveal intended operational ownership. Hiring intent is supporting context, not evidence that a system is deployed.
    source_ids: [yc-jobs]
    source_types: [job-posting]
    dimension: operational_adoption
    evidence_limit: 8
  - id: github-adoption
    title: GitHub adoption proxies
    description: Stars, forks, and recent pushes help prioritize engineering artifacts. Popularity is never treated as production adoption.
    source_ids: [github]
    source_types: [repository]
    dimension: technical_reality
    evidence_limit: 8
  - id: production-architecture
    title: Production architecture reports
    description: Detailed architecture and deployment reports are the strongest public bridge between technical possibility and real operating use.
    source_types: [first-party-lab, practitioner-blog, operator-essay]
    terms: [architecture, production, deployed, deployment, platform, reliability, latency, scale]
    dimension: operational_adoption
    evidence_limit: 8
