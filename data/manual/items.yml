  - id: github:1384094559
    source_id: github
    source_type: repository
    title: Contrastive-LM/CLM
    url: https://github.com/Contrastive-LM/CLM
    published_at: "2026-09-23T19:29:56Z"
    summary: >-
      Open-source implementation of CLM-8B, a contrastively trained System One
      decision model that ranks candidate actions from separately cacheable
      state and action embeddings. The maintainers report performance comparable
      with Jev at up to nine times lower latency and strong agentic-code verifier
      results; those benchmark claims have not been independently reproduced.
    authors:
      - Jacky Kwok
      - Hangoo Kang
      - Tarun Suresh
      - Jon Saad-Falcon
      - Marco Pavone
      - Christopher Ré
      - Azalia Mirhoseini
