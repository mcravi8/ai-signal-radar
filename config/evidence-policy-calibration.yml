      Several independent technical systems make the requirement technically real,
      but the sampled corpus does not contain independent production deployments with
      measured operating outcomes. Research and engineering evidence dominate.
    evidence_gaps:
      - Independent production reports with intervention, rollback, or incident metrics.
      - A systematic search for cases where conventional testing and access controls were sufficient.

  - id: heterogeneous-model-routing
    title: Heterogeneous model routing
    requirement: AI systems should route work across heterogeneous models and inference paths.
    description: >-
      Instead of treating one frontier model as the entire product architecture, a routing
      layer selects the model, runtime, or deterministic path that best fits each task. The
      decision can account for quality, latency, privacy, capacity, and cost, while preserving
      fallbacks when a provider or specialized model fails.
    what_it_looks_like:
      - Define task classes and service objectives rather than sending every request to the same endpoint.
      - Compare models using accepted-output quality, latency, and total cost for each task class.
      - Add fallbacks, caching, capacity limits, and drift monitoring around the routing decision.
    applicable_to: Startups with meaningful inference volume, distinct task types, privacy constraints, or reliability requirements.
    source_analysis: early-signal-tracker/heterogeneous-inference
    evidence_links:
      - evidence_id: hf-paper:2609.18063
