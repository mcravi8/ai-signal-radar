      counterevidence_reviewed: false
      cost_of_absence_evidenced: false
      practical_minimum_available: false
    expected_maturity: narrative
    rationale: >-
      Company formation, investment, and one open-source implementation show that
      workflow ownership is a real product narrative. The evidence does not yet
      demonstrate reliable completion, exception handling, or attributable business
      outcomes in independent production environments.
    evidence_gaps:
      - Customer-controlled measurements of completed work, intervention rate, error cost, and business outcome.
      - Technical implementations with explicit completion checks, exception routing, and systems-of-record writes.
      - Counterevidence about workflows where assistance remains safer or more economical than autonomous ownership.
